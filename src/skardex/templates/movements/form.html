{% extends "base.html" %}

{% block title %}Registrar movimiento — Simple Kardex{% endblock %}

{% block content %}
<main class="k-main">
    <div class="k-formcard">
        <div style="margin-bottom:20px">
            <p class="k-eyebrow">Kardex</p>
            <h1 style="font-size:22px">Registrar movimiento</h1>
        </div>

        {% if error %}
        <p class="k-banner">{{ error }}</p>
        {% endif %}

        <form class="k-form" method="post" action="/movements/new">
            <div class="k-field">
                <label class="k-label" for="material_id">Material</label>
                <select class="k-select" id="material_id" name="material_id" required>
                    <option value="" disabled selected>Selecciona un material</option>
                    {% for material in materials %}
                    <option value="{{ material.id }}">{{ material.name }} · saldo {{ balances.get(material.id, 0) }} {{ unit_labels.get(material.unit, material.unit) }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="k-field">
                <span class="k-label">Tipo de movimiento</span>
                <div class="k-seg" style="display:grid;grid-template-columns:1fr 1fr;width:100%">
                    <label class="k-radio">
                        <input type="radio" name="movement_type" value="entrada" checked>
                        <span class="k-btn k-btn--ghost k-btn--block">Entrada</span>
                    </label>
                    <label class="k-radio">
                        <input type="radio" name="movement_type" value="salida">
                        <span class="k-btn k-btn--ghost k-btn--block">Salida</span>
                    </label>
                </div>
            </div>

            <div class="k-form__row">
                <div class="k-field">
                    <label class="k-label" for="quantity">Cantidad</label>
                    <input class="k-input" type="number" step="0.001" min="0" id="quantity" name="quantity" required placeholder="0">
                </div>
                <div class="k-field">
                    <label class="k-label" for="movement_date">Fecha</label>
                    <input class="k-input" type="date" id="movement_date" name="movement_date" value="{{ today }}" required>
                </div>
            </div>

            <div class="k-field">
                <label class="k-label" for="note">Observación (opcional)</label>
                <textarea class="k-textarea" id="note" name="note" rows="2" placeholder="Compra a proveedor, consumo en obra…"></textarea>
            </div>

            <div class="k-form__actions">
                <button type="submit" class="k-btn k-btn--primary">Guardar</button>
                <a class="k-btn k-btn--ghost" href="/movements">Cancelar</a>
            </div>
        </form>
    </div>
</main>
{% endblock %}
