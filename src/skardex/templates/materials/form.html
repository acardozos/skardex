{% extends "base.html" %}

{% block title %}{% if material %}Editar material{% else %}Nuevo material{% endif %} — Simple Kardex{% endblock %}

{% block content %}
<article style="max-width: 500px; margin: 2rem auto;">
    <h1>{% if material %}Editar material{% else %}Nuevo material{% endif %}</h1>

    {% if error %}
    <p style="color: var(--pico-del-color);">{{ error }}</p>
    {% endif %}

    <form method="post" action="{% if material %}/materials/{{ material.id }}/edit{% else %}/materials/new{% endif %}">
        <label>
            Código (opcional)
            <input type="text" name="code" value="{{ (material.code or '') if material else '' }}">
        </label>
        <label>
            Nombre
            <input type="text" name="name" required value="{{ material.name if material else '' }}">
        </label>
        <label>
            Unidad de medida
            <select name="unit" required>
                <option value="" disabled {% if not material %}selected{% endif %}>Selecciona una unidad</option>
                {% for u in units %}
                <option value="{{ u }}" {% if material and material.unit == u %}selected{% endif %}>{{ u }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            Stock mínimo (opcional)
            <input type="number" step="0.001" min="0" name="min_stock" value="{{ material.min_stock if material and material.min_stock is not none else '' }}">
        </label>
        <button type="submit">Guardar</button>
        <a href="/materials" role="button" class="secondary">Cancelar</a>
    </form>
</article>
{% endblock %}
