<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Simple Kardex{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2" defer></script>
</head>
<body>
{% if request.session.get("user_id") %}
<nav class="container">
    <ul>
        <li><strong>Simple Kardex</strong></li>
    </ul>
    <ul>
        <li><a href="/">Inicio</a></li>
        <li><a href="/materials">Materiales</a></li>
        <li><a href="/movements">Movimientos</a></li>
        {% if request.session.get("role") == "admin" %}
        <li><a href="/users">Usuarios</a></li>
        {% endif %}
        <li>
            <form method="post" action="/logout" style="display:inline;">
                <button type="submit" class="secondary">Salir</button>
            </form>
        </li>
    </ul>
</nav>
{% endif %}
<main class="container">
    {% block content %}{% endblock %}
</main>
</body>
</html>
