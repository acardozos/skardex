{% extends "base.html" %}

{% block title %}Mi cuenta — Simple Kardex{% endblock %}

{% block content %}
<main class="k-main">
    <div class="k-formcard" style="max-width:420px">
        <div style="margin-bottom:20px">
            <p class="k-eyebrow">Mi cuenta</p>
            <h1 style="font-size:22px">Cambiar contraseña</h1>
        </div>

        {% if error %}
        <p class="k-banner">{{ error }}</p>
        {% endif %}

        <form class="k-form" method="post" action="/account/password">
            <div class="k-field">
                <label class="k-label" for="current_password">Contraseña actual</label>
                <input class="k-input" type="password" id="current_password" name="current_password" required autofocus autocomplete="current-password">
            </div>
            <div class="k-field">
                <label class="k-label" for="new_password">Contraseña nueva</label>
                <input class="k-input" type="password" id="new_password" name="new_password" required placeholder="Mínimo 8 caracteres" autocomplete="new-password">
            </div>
            <div class="k-field">
                <label class="k-label" for="confirm_password">Confirmar contraseña nueva</label>
                <input class="k-input" type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
            </div>
            <div class="k-form__actions">
                <button type="submit" class="k-btn k-btn--primary">Cambiar contraseña</button>
                <a class="k-btn k-btn--ghost" href="/">Cancelar</a>
            </div>
        </form>
    </div>
</main>
{% endblock %}
