name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src tests

      - name: Run tests
        run: uv run pytest
        env:
          # Dummy values: tests never hit a real Postgres (SQLite in
          # memory via a get_db override), but Settings requires these
          # to be set for the app to import.
          DATABASE_URL: "postgresql+psycopg://ci:ci@localhost:5432/ci"
          SECRET_KEY: "ci-test-secret-key"
          SEED_ADMIN_USERNAME: "admin"
          SEED_ADMIN_PASSWORD: "ci-test-password"
          SESSION_HTTPS_ONLY: "false"

  # Render's own auto-deploy cannot see pushes to this repository (the Render
  # account is tied to a different GitHub identity), so the pipeline asks Render
  # to deploy instead, and only once every check above has passed. The deploy
  # hook URL is a secret: it lives in the repository secrets, never in the code.
  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    concurrency:
      group: render-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger the Render deploy for the tested commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -eu
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "The RENDER_DEPLOY_HOOK_URL secret is not set; nothing was deployed." >&2
            exit 1
          fi
          # Deploy exactly the commit that was just tested. The hook URL already
          # carries a ?key=..., so `ref` is appended with & (or ? if it did not).
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator="&" ;;
            *) separator="?" ;;
          esac
          curl --fail --silent --show-error --max-time 30 \
            --request POST "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}"
          echo

