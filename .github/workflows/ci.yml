name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src tests

      - name: Run tests
        run: uv run pytest
        env:
          # Dummy values: tests never hit a real Postgres (SQLite in
          # memory via a get_db override), but Settings requires these
          # to be set for the app to import.
          DATABASE_URL: "postgresql+psycopg://ci:ci@localhost:5432/ci"
          SECRET_KEY: "ci-test-secret-key"
          SEED_ADMIN_USERNAME: "admin"
          SEED_ADMIN_PASSWORD: "ci-test-password"
          SESSION_HTTPS_ONLY: "false"
